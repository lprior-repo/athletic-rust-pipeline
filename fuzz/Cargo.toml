[package]
name = "fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
census-crawl = { path = "../crates/census-crawl" }
census-domain = { path = "../crates/census-domain" }
libfuzzer-sys = "0.4"

[[bin]]
name = "hytek"
path = "fuzz_targets/hytek.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compiled"
path = "fuzz_targets/compiled.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xc"
path = "fuzz_targets/xc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "raceday"
path = "fuzz_targets/raceday.rs"
test = false
doc = false
bench = false

[workspace]
