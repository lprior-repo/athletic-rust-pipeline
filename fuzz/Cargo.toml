test = false
doc = false
bench = false

[[bin]]
name = "xlsx_zip_stream"
path = "fuzz_targets/xlsx_zip_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "workbook_ingestion"
path = "fuzz_targets/workbook_ingestion.rs"
test = false
doc = false
bench = false

[[bin]]
