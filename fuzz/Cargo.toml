[package]
name = "athletic-rust-pipeline-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
athletic-rust-pipeline = { path = "..", features = ["fuzzing"] }
libfuzzer-sys = "0.4"
anyhow = "1"
serde = "1"
serde_json = "1"
tempfile = "3"

[[bin]]
name = "search_json_html"
path = "fuzz_targets/search_json_html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "profile_html_embedded_json"
path = "fuzz_targets/profile_html_embedded_json.rs"
test = false
doc = false
bench = false

