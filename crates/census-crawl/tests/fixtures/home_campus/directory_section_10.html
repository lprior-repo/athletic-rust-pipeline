<script>
    $(document).ready(function(){
        var $input = $(".typeahead");
        var path = "/widget/schools/get"

        var sectionId = $('#section-id').val();

        var section_id = "10"

        $('#school-info-is-hidden').hide();

        $('#section').change(function(){
            $('.typeahead').value = ''

            setTimeout(() => {
                document.forms['search'].submit();
            }, 300);

            sectionId = $(this).val();
            $input.typeahead('val', '');
            $(".typeahead").val("")
            $(".typeahead").trigger('propertychange.typeahead');
        });

        $input.typeahead({
        source: function (query, process) {
                return $.get(path, {
                    school: query,
                    section_id: sectionId,
                    status: 'active',
                    hide_from_directory: 0
                }, function (data) {
                    return process(data);
                });
            },
        });

        $input.change(function() {
            var current = $input.typeahead("getActive");
            if (current) {
                if (current.name == $input.val()) {
                   $('#school-id').val(current.id);

                   $('.school-btn').removeClass('active-directory-link')

                   $('#school-button-' + current.id).addClass('active-directory-link')

                   getDetails(current.id);
                }
            }
            else
            {
                $('#school-id').val('');
            }
        });

        
        function getDetails(id) {
            if (history.pushState) {
                var newurl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?school_id=' + id + '&section_id=' + section_id;
                window.history.pushState({path:newurl},'',newurl);
            }

            $.get('/widget/get-school-details/'+id+'/details').then(function(data)
            {
                if (data['school']['hide_from_directory'] == 1) {
                    $('#school-info').hide();
                    $('#school-info-is-hidden').show();
                } else {
                    $('#school-info').show();
                    $('#school-info-is-hidden').hide();
                }

                let str = '',
                facultyStr = '',
                sportAndLevel = '',
                coachStr = '';

                if (data)
                {
                    str += '<h2 class="h2-smaller font-weight-bold">'+data['school']['name']+' - School Information</h2>'+
                            '<div class="row">'+
                                '<div class="col-lg-8">'+
                                '<div class="d-flex justify-content-between pb-2 text-gray">'+
                                    '<div class="col-6 px-0">'+
                                        '<span>School Full Name:</span>'+
                                    '</div>'+
                                    '<div class="col-6 px-0">'+
                                        '<span>'+data['school']['full_name']+'</span>'+
                                    '</div>'+
                                '</div>'+
                                '<div class="border-top d-flex justify-content-between py-2 text-gray">'+
                                    '<div class="col-6 px-0">'+
                                        '<span>Common Name:</span>'+
                                    '</div>'+
                                    '<div class="col-6 px-0">'+
                                        '<span>'+data['school']['name']+'</span>'+
                                    '</div>'+
                                '</div>'+
                                '<div class="border-top d-flex justify-content-between py-2 text-gray">'+
                                    '<div class="col-6 px-0">'+
                                        '<span>School ID:</span>'+
                                    '</div>'+
                                    '<div class="col-6 px-0">'+
                                        '<span>'+ (parseInt(section_id) === 10 ? 
                                            (data['school']['fhsaa_school_id'] !== null && data['school']['fhsaa_school_id'] !== undefined && data['school']['fhsaa_school_id'] !== '' ? 
                                                data['school']['fhsaa_school_id'] : 
                                                data['school']['id']) : 
                                            data['school']['id'] 
                                        )+'</span>'+
                                    '</div>'+
                                '</div>'+
                                '<div class="border-top d-flex justify-content-between py-2 text-gray">'+
                                    '<div class="col-6 px-0">'+
                                        '<span>Section:</span>'+
                                    '</div>'+
                                    '<div class="col-6 px-0">'+
                                        '<span>'+data['school']['section']+'</span>'+
                                    '</div>'+
                                '</div>';

                                if (data['geoGroups'])
                                {
                                    for (let key in data['geoGroups'])
                                    {
                                        str += '<div class="border-top d-flex justify-content-between py-2 text-gray">'+

                                                        '<span>'+data['geoGroups'][key]['type']+':</span>'+
                                                    '</div>'+
                                                    '<div class="col-6 px-0">'+
                                                        '<span>'+(data['geoGroups'][key]['value']!==null ? data['geoGroups'][key]['value']['name'] : '')+'</span>'+
                                                    '</div>'+
                                                '</div>';
                                    }
                                }

                        str += '<div class="border-top d-flex justify-content-between py-2 text-gray">'+

                                        '<span>'+data['school']['physical_state']+'</span>'+
                                    '</div>'+

                                '<div class="border-top d-flex justify-content-between py-2 text-gray">'+
                                    '<div class="col-6 px-0">'+
