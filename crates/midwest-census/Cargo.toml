[package]
name = "midwest-census"
version = "0.1.0"
edition = "2021"
description = "Independent Midwest HS TF/XC recruiting graph: official associations, MileSplit HTML, TFRRS/DirectAthletics, result artifacts. No Athletic.net dependency."
license = "MIT"

[[bin]]
name = "midwest-census"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1"
futures = "0.3"
regex = "1.11"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = "3"
