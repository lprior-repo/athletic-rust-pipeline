[package]
name = "census-service"
version = "0.1.0"
edition = "2021"
description = "Independent Midwest HS TF/XC recruiting graph: official associations, MileSplit HTML, TFRRS/DirectAthletics, result artifacts. No Athletic.net dependency."
license = "MIT"

[lints]
workspace = true

[[bin]]
name = "census-service"
path = "src/main.rs"

[[bin]]
name = "census-serve"
path = "src/bin/census-serve.rs"

[features]
# `loom` compiles the concurrency models for the store's sequence allocation and the region
# ledger. The models live behind `cfg(all(feature = "loom", test))`, so a default build neither
# compiles the dependency nor the models; run them with `cargo test -p census-service --features
# loom --lib` (the models bound their own exploration, so the all-features gate lane stays quick).
loom = ["dep:loom"]

[dependencies]
# The headed browser lane's engine: the endpoint serves it as `BrowserSession`, and the census
# reaches it over the ingress client rather than linking it.
athleticnet-browser = { path = "../athleticnet-browser" }
anyhow = "1"
# The acquisition plane (fetcher, provider adapters, provider registry) is its own crate now; the
# sweep, the meet walk and the CLI here are its consumers.
census-crawl = { path = "../census-crawl" }
census-domain = { path = "../census-domain" }
# The review lane (retained families, model packets, verdict records) is its own crate now; the
# workbook's conflict queue and the `review` verb are its two consumers here.
census-review = { path = "../census-review" }
# The reporting plane (coverage, bests, workbook export) is its own crate now; the CLI's export and
# seal verbs are its consumers here.
census-report = { path = "../census-report" }
census-store = { path = "../census-store" }
clap = { version = "4.5", features = ["derive"] }
csv = "1"
futures = "0.3"
loom = { version = "0.7", optional = true }
regex = "1.11"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream", "query"] }
restate-sdk = { version = "=0.12.0", default-features = false, features = ["http_server", "aws_lc_rs", "reqwest-client"] }
rust_xlsxwriter = { version = "=0.99.1", features = ["constant_memory"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }
# The seal command reads the exported workbook back, so the reader is a runtime dependency.
calamine = "=0.36.1"

[dev-dependencies]
criterion = "0.8"
# The integration tests that exercise the store directly (backup/restore, recovery, kill/restart)
# open a Fjall database themselves; production code reaches Fjall through `census-store`.
fjall = "=3.1.10"
loom = "0.7"
proptest = "1"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = "3"

# The committed measurement target: result-file parsing, school-label resolution and the read-time
# merge, on the entry points the census actually drives. `harness = false` hands the run to
# criterion; helpers live in `benches/core/`.
[[bench]]
name = "core"
harness = false

[[bench]]
name = "pipeline"
harness = false
