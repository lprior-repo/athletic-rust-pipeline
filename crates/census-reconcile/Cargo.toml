[package]
name = "census-reconcile"
version = "0.1.0"
edition = "2021"
description = "Reconciliation lane (§17): deterministic workflow identity and row-level verification of the published workbook against the store."
license = "MIT"

[lints]
workspace = true

[dependencies]
census-domain = { path = "../census-domain" }
# The derive pass reuses the reporting plane's own rendering — the coverage report and the families
# the workbook sheets print — so a reader of the store and a reader of the workbook cannot be shown
# different findings.
census-report = { path = "../census-report" }
census-store = { path = "../census-store" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
fjall = "=3.1.10"
tempfile = "3"
