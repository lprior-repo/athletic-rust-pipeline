[package]
name = "athleticnet-browser"
version = "0.1.0"
edition = "2021"
description = "Single Athletic.net effect system: Chromium supervisor, persistent profile, tab pool, CDP request/response capture, challenge detection, 429 cooldown, bounded single-attempt admission."
license = "MIT"

[lints]
workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
chromiumoxide = "=0.9.1"
futures = "0.3"
httpdate = "1"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = { version = "2.5", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["process"] }

[dev-dependencies]
flate2 = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
