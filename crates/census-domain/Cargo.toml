[package]
name = "census-domain"
version = "0.1.0"
edition = "2021"
description = "Pure domain model for the Midwest census: canonical entities, deterministic ids, cohort identity. No async, no I/O."
license = "MIT"

[lints]
workspace = true

[dependencies]
rust_decimal = { version = "1.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

