[package]
name = "athletic-rust-pipeline"
version = "0.1.0"
edition = "2021"
description = "Streaming XLSX athlete matching pipeline with deterministic source evidence and local models"
license = "MIT"
[features]
default = []
fuzzing = []

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fjall = "=3.1.10"
futures = "0.3"
httpdate = "1"
quick-xml = "=0.41.0"
regex = "1.11"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream", "query"] }
restate-sdk = { version = "=0.12.0", default-features = false, features = ["http_server", "aws_lc_rs", "reqwest-client"] }
rust_xlsxwriter = { version = "=0.99.1", features = ["constant_memory"] }
calamine = "=0.36.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1", features = ["v7", "serde"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
lol_html = "=2.9.0"
html-escape = "=0.2.13"

[dev-dependencies]
http = "1"
axum = "0.8"
proptest = "1"
mockito = "1"
tokio = { version = "1", features = ["test-util"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "pipeline"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
