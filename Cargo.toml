[package]
name = "athletic-rust-pipeline"
version = "0.1.0"
edition = "2021"
description = "Streaming XLSX athlete matching pipeline with deterministic source evidence and local models"
license = "MIT"

[lints]
workspace = true

[workspace]
members = ["crates/midwest-census", "xtask"]

[features]
default = []
fuzzing = []

[dependencies]
anyhow = "1"
base64 = "0.22"
chromiumoxide = "=0.9.1"
clap = { version = "4.5", features = ["derive"] }
fjall = "=3.1.10"
futures = "0.3"
httpdate = "1"
quick-xml = "=0.41.0"
regex = "1.11"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream", "query"] }
restate-sdk = { version = "=0.12.0", default-features = false, features = ["http_server", "aws_lc_rs", "reqwest-client"] }
rust_xlsxwriter = { version = "=0.99.1", features = ["constant_memory"] }
calamine = "=0.36.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
lol_html = "=2.9.0"
html-escape = "=0.2.13"

[dev-dependencies]
http = "1"
axum = "0.8"
proptest = "1"
mockito = "1"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Workspace lints apply to every target, including tests, so they stay at the severity that is
# safe repo-wide. The stricter production-only surface (no unwrap/expect/panic/indexing, no
# unchecked arithmetic or casts, no `let _ =` on a must-use value) is enforced by
# tools/gate.sh on --lib/--bins/--examples, which is where production reachability is measured.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic_in_result_fn = "deny"

# Chromium 151 replaced Network.ClientSecurityState.privateNetworkRequestPolicy with
# localNetworkAccessRequestPolicy, so the pinned generated model rejects every
# Network.*ExtraInfo frame ("data did not match any variant of untagged enum Message")
# and the CDP client drops it. Keep exactly one struct tolerant locally until the
# upstream model catches up; nothing else in the vendored crate is modified.
[patch.crates-io]
chromiumoxide_cdp = { path = "vendor/chromiumoxide_cdp" }
