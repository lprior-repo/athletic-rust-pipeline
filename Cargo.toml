[package]
name = "athletic-rust-pipeline"
version = "0.1.0"
edition = "2021"
description = "Streaming XLSX athlete matching pipeline with direct Athletic.net search, Spider, and local models"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
fjall = "=3.1.10"
futures = "0.3"
httpdate = "1"
quick-xml = "0.38"
regex = "1.11"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream", "query"] }
restate-sdk = { version = "=0.12.0", default-features = false, features = ["http_server", "rust_crypto", "reqwest-client"] }
scraper = { version = "=0.27.0", default-features = false, features = ["deterministic"] }
html5ever = "=0.39.0"
rust_xlsxwriter = { version = "=0.99.1", features = ["constant_memory"] }
calamine = "=0.36.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
thiserror = "2"
spider = { version = "2.53.6", features = ["sync"] }
strsim = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1", features = ["v7", "serde"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = "0.8"
proptest = "1"
mockito = "1"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true