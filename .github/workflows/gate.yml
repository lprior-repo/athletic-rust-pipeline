# Phase 0 acceptance: CI runs the same gate the workstation runs - `cargo xtask gate`, the
# `.cargo/config.toml` alias for `cargo run -p xtask -- gate`, which runs `tools/gate.sh` with no
# extra flags and prints the child command before it runs.
#
# Fidelity to the local run is the point, so two tempting shortcuts are deliberately absent:
#
#   * the toolchain is not restated here. `rustup show` installs whatever `rust-toolchain.toml` pins
#     (channel, components, target), so the pin keeps one source of truth and cannot drift from the
#     workstation. The check and clippy lanes pass `-Zallow-features=portable_simd,try_blocks`; on a
#     toolchain other than the pinned nightly those lanes fail rather than quietly dropping the check.
#   * no `target/` cache is restored. The gate measures this tree - forbidden constructs, size
#     budgets, and the debt ratchet against `tools/quality-baseline.json`, which holds no allowances
#     to grow - and a run reusing artifacts from another commit is not the run a workstation does.
#
# Nothing here narrows the network either: no lane passes `--offline` (checked across `tools/` and
# `xtask/`), so CI and the workstation need the same registry access.
#
# Only the official checkout action is used - no third-party actions - so the workflow adds nothing
# to the dependency surface the gate's deny lane audits.
#
# The optional tool lanes install best-effort, exactly as on a workstation: the gate is built to stay
# honest without them - an absent tool prints SKIP next to its lane - so a failed install narrows the
# run visibly instead of failing or, worse, silently weakening it. `cargo-deny` is the exception and
# must install: the deny lane runs through `run_lane`, not `run_tool_lane`, so an absent tool fails
# the lane. The heavy lane (`mutants`) and the strict pass (`tools/gate.sh --release`, where every
# lane runs and a missing tool is a FAILURE) belong to a pre-release run and are dispatched by hand,
# not on every push.

name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and its components
        run: rustup show
      - name: Install the gate's tool lanes (best effort, as on a workstation)
        run: |
          for tool in cargo-nextest cargo-deny cargo-audit cargo-machete cargo-geiger cargo-vet cargo-hack; do
            cargo install "$tool" --locked || echo "gate tool unavailable: $tool (its lane will SKIP)"
          done
      - name: Install the pinned Restate 1.7.10 server the kill/restart test proves against
        run: |
          # Not best-effort like the lanes above: `crates/census-service/tests/restate_kill_restart.rs`
          # looks for the binary at `$RESTATE_SERVER_BIN`, then
          # `$HOME/.local/share/athletic-rust-pipeline/restate/1.7.10/restate-server`, then PATH, and
          # refuses to pass when it finds none — the test exists to prove a real server resumes a run
          # whose endpoint was killed, so a silent skip would turn the proof into a decoration. The
          # pinned path is the one it probes first among the two that need no environment.
          set -euo pipefail
          dir="$HOME/.local/share/athletic-rust-pipeline/restate/1.7.10"
          base=https://github.com/restatedev/restate/releases/download/v1.7.10
          artefact=restate-server-x86_64-unknown-linux-musl.tar.xz
          mkdir -p "$dir"
          curl -sSL -o "/tmp/$artefact" "$base/$artefact"
          curl -sSL -o "/tmp/$artefact.sha256" "$base/$artefact.sha256"
          expected=$(cut -d' ' -f1 "/tmp/$artefact.sha256")
          actual=$(sha256sum "/tmp/$artefact" | cut -d' ' -f1)
          test -n "$expected" && test "$expected" = "$actual"
          tar xJf "/tmp/$artefact" -C "$dir"
          if [ ! -x "$dir/restate-server" ]; then
            found=$(find "$dir" -maxdepth 3 -type f -name restate-server | head -1)
            test -n "$found" && mv "$found" "$dir/restate-server"
          fi
          test -x "$dir/restate-server"
          "$dir/restate-server" --version
      - name: Gate
        run: cargo xtask gate
