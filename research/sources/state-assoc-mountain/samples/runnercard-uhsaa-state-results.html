<meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
<title>RunnerCard Results</title>
</head>
<body>
<script language="JavaScript" type="text/javascript">
function getQuery(){
	var qsParm = new Array();
	var query = window.location.search.substring(1);
	var parms = query.split('&');
	for (var i=0; i<parms.length; i++){
		var pos = parms[i].indexOf('=');
		if (pos > 0){
			var key = parms[i].substring(0,pos);
			var val = parms[i].substring(pos+1);
			qsParm[key] = val;
		}
	}
	return qsParm;
}

var Query = getQuery();

//self.window.location.href = "http://66.29.162.100/Results/ViewResults.html?class=server&meetid=" + Query["meetid"];
self.window.location.href = "http://results.runnercard.com/Results/results.jsp?meetid=" + Query["meetid"];
</script>
</body>
</html>
