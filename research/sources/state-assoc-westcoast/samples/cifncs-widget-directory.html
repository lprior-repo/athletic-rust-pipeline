<script>
    $(document).ready(function(){
        var $input = $(".typeahead");
        var path = "/widget/schools/get"

        var sectionId = $('#section-id').val();

        var section_id = "7"

        $('#school-info-is-hidden').hide();

        $('#section').change(function(){
            $('.typeahead').value = ''

            setTimeout(() => {
                document.forms['search'].submit();
            }, 300);

            sectionId = $(this).val();
            $input.typeahead('val', '');
            $(".typeahead").val("")
            $(".typeahead").trigger('propertychange.typeahead');
        });

        $input.typeahead({
        source: function (query, process) {
                return $.get(path, {
                    school: query,
                    section_id: sectionId,
                    status: 'active',
                    hide_from_directory: 0
                }, function (data) {
                    return process(data);
                });
            },
        });

        $input.change(function() {
            var current = $input.typeahead("getActive");
            if (current) {
                if (current.name == $input.val()) {
                   $('#school-id').val(current.id);

                   $('.school-btn').removeClass('active-directory-link')

                   $('#school-button-' + current.id).addClass('active-directory-link')

                   getDetails(current.id);
                }
            }
            else
            {
                $('#school-id').val('');
            }
        });
