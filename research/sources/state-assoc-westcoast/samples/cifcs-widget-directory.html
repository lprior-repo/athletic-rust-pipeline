                    if (data['athleticFaculties'])
                    {
                        let athleticFacultyOrder = [
                            'Principal',
                            'Vice Principal',
                            'Athletic Director',
                            'AD Assistant',
                            'Activities Director',
                            'Athletic Trainer',
                            'Financial Contact',
                            'Unified Contact',
                        ]

                        for (let aft in athleticFacultyOrder)
                        {

                            for (let key in data['athleticFaculties'])
                            {
                                if (data['athleticFaculties'][key]['aft_name'] == athleticFacultyOrder[aft])
                                {
                                    facultyStr += '<div class="border-bottom py-3">'+
                                                        '<h3 class="h3-smaller font-weight-bold">'+data['athleticFaculties'][key]['aft_name']+'</h3>'+
                                                        '<p class="mb-0">Name: '+data['athleticFaculties'][key]['firstname']+' '+data['athleticFaculties'][key]['lastname']+'</p>'+
                                                        '<p class="mb-0">Email: ' + (data['athleticFaculties'][key]['email'] !== null ? data['athleticFaculties'][key]['email'] : '' )+'</p>'+
                                                        '<p class="mb-0">Office Number: ' + (data['athleticFaculties'][key]['work_phone'] !==null  ? data['athleticFaculties'][key]['work_phone'] : '') +'</p>'+
                                                        '<p class="mb-0">Ext.: '+  (data['athleticFaculties'][key]['work_extension']  !==null  ? data['athleticFaculties'][key]['work_extension'] : '') +'</p>'+
                                                    '</div>';
                                }
                            }
                        }
                    }

                    if (data['coaches'])
                    {
                        coachStr =  '<h2 class="h2-smaller font-weight-bold">'+data['school']['name']+' - Coaches & Sports</h2>';
                        sport = '';
                        sportAndLevel = '';
                        headCoach = '';
                        asstCoach = '';

                        for (let key in data['coaches'])
                        {
                            var tmpSportAndLevel = data['coaches'][key]['sport_id']+'-'+data['coaches'][key]['level_id'];
                            if (tmpSportAndLevel != sportAndLevel)
                            {
                                if (asstCoach == 'N/A')
                                {
                                    headCoach = '';
                                }

                                coachStr += '<h3 class="h3-smaller font-weight-bold mt-4">'+data['coaches'][key]['sport']+'</h3>';

                                if (parseInt(section_id) === 8)
                                {
                                    coachStr += '<p class="mb-0 font-weight-bold">' + data['coaches'][key]['level_name'] + '</p>';
                                }

                                
                                sport = data['coaches'][key]['sport'];
                                sportAndLevel = data['coaches'][key]['sport_id']+'-'+data['coaches'][key]['level_id'];
                            }

                            if (data['coaches'][key]['na_coach'] == 1)
                            {
                                coachStr += "Position not filled";
                                continue;
                            }
                            
                            if (data['coaches'][key]['aft_name'] == 'Head Coach')
                            {
                                headCoach = '';
                            }
                            
                            if (data['coaches'][key]['aft_name'] == 'Assistant Coach')
                            {
                                asstCoach = '';
                            }

                            if (data['coaches'][key]['aft_name'] == 'Assistant Coach' && headCoach == 'N/A')
                            {
                                headCoach = '';
                            }

                            coachStr +=   '<div class="mt-3">'+
                                                '<b class="font-weight-bold">'+data['coaches'][key]['aft_name']+'</b>'+
                                                '<p class="mb-0">Name: '+data['coaches'][key]['firstname']+' '+data['coaches'][key]['lastname']+'</p>'+
                                                '<p class="mb-0">Email: '+data['coaches'][key]['email']+'</p>'+
                                            '</div>';
                        }

                        if (headCoach == '' && asstCoach == 'N/A')
                        {
                            headCoach = '';
                        }
                    }
                }


                $('#school-information').html(str);
                $('#athletic-faculty').html(facultyStr);
                $('#coaches-and-sports').html(coachStr);
            });
        }

        $('.school-btn').click(function(){
            var id = $(this).data('id');

            $('.school-btn').removeClass('active-directory-link')

            $(this).addClass('active-directory-link')

            getDetails(id)  
        });

            });
</script>
